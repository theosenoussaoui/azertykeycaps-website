name: Deploy Cloudflare (Web + Server + CMS)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - "apps/cms/**"
      - "packages/**"
      - ".github/workflows/deploy-cloudflare.yml"
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - "apps/cms/**"
      - "packages/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.ref == 'refs/heads/main' && 'prod' || github.ref_name) }}

jobs:
  # Run CI checks first
  ci:
    if: ${{ github.event.action != 'closed' }}
    uses: ./.github/workflows/ci.yml

  # Deploy Web + Server via Alchemy (runs in parallel with CMS)
  deploy-apps:
    if: ${{ github.event.action != 'closed' }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Deploy Web + Server to Cloudflare
        run: bun alchemy deploy --stage ${{ env.STAGE }}
        working-directory: packages/infra
        env:
          CI: true
          # Alchemy & Cloudflare credentials
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # Aliased for Alchemy/server code
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # GitHub context
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # App environment variables
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          # Cache invalidation (shared secret between CMS and Server)
          CACHE_INVALIDATION_SECRET: ${{ secrets.CACHE_INVALIDATION_SECRET }}
          # CMS API key for authenticated requests from Server to CMS
          CMS_API_KEY: ${{ secrets.CMS_API_KEY }}
          # Payload CMS secret (for encryption)
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          # Custom domains for production (Alchemy attaches these to Workers)
          WEB_DOMAIN: ${{ secrets.WEB_DOMAIN }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          CMS_DOMAIN: ${{ secrets.CMS_DOMAIN }}

  # Deploy CMS via Payload/wrangler (runs in parallel with Web + Server)
  deploy-cms:
    if: ${{ github.event.action != 'closed' }}
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Deploy CMS (Payload)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            export CLOUDFLARE_ENV=prod
          fi

          # Generate importMap (required for Next.js build)
          bun run generate:importmap

          # Run database migrations (MUST succeed - migrations are source of truth)
          bun run deploy:database

          # Build and deploy the app
          bun run deploy:app

          # Set worker secrets (must be done after deploy creates the worker)
          echo "${{ secrets.PAYLOAD_SECRET }}" | bunx wrangler secret put PAYLOAD_SECRET ${CLOUDFLARE_ENV:+--env=$CLOUDFLARE_ENV}
          echo "${{ secrets.CACHE_INVALIDATION_SECRET }}" | bunx wrangler secret put CACHE_INVALIDATION_SECRET ${CLOUDFLARE_ENV:+--env=$CLOUDFLARE_ENV}
        working-directory: apps/cms
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CACHE_INVALIDATION_SECRET: ${{ secrets.CACHE_INVALIDATION_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cleanup:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Safety Check
        run: |
          if [ "${{ env.STAGE }}" = "prod" ]; then
            echo "ERROR: Cannot destroy prod environment"
            exit 1
          fi

      - name: Destroy Preview Environment
        run: bun alchemy destroy --stage ${{ env.STAGE }}
        working-directory: packages/infra
        env:
          CI: true
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          PULL_REQUEST: ${{ github.event.number }}
