name: Deploy CMS (Vercel)

on:
  push:
    branches: [main]
    paths:
      - "apps/cms/**"
      - "packages/schemas/**"
      - ".github/workflows/deploy-cms.yml"
  pull_request:
    paths:
      - "apps/cms/**"
      - "packages/schemas/**"
      - ".github/workflows/deploy-cms.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run CI checks first
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build CMS
        run: bun run build
        working-directory: apps/cms
        env:
          # Database (Turso for production)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          # Payload CMS
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.CMS_PUBLIC_URL }}
          # Vercel Blob storage
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # Cache invalidation
          CACHE_INVALIDATION_URL: ${{ secrets.CACHE_INVALIDATION_URL }}
          CACHE_INVALIDATION_SECRET: ${{ secrets.CACHE_INVALIDATION_SECRET }}
          # Cloudflare CDN purge
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEB_URL: ${{ secrets.WEB_URL }}

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_CMS_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: apps/cms

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        id: vercel-preview
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_CMS_PROJECT_ID }}
          working-directory: apps/cms

      - name: Comment Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## CMS Preview Deployed

            **URL:** ${{ steps.vercel-preview.outputs.preview-url }}

            Built from commit \`${context.sha.slice(0, 7)}\`

            ---
            <sub>This comment updates automatically with each push.</sub>`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existingComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('CMS Preview Deployed')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }
