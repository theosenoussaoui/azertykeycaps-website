name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run linter and formatter
        run: bun run check

  build-cms:
    name: Build CMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build CMS
        run: bun run build
        working-directory: apps/cms
        env:
          DATABASE_URL: file:./payload.db
          PAYLOAD_SECRET: ci-build-secret-minimum-32-characters-long

  # Note: Web and Server builds require Cloudflare/Alchemy environment
  # - Web uses Alchemy Vite plugin which needs wrangler.jsonc (generated by alchemy deploy)
  # - Server imports from cloudflare:workers module
  # Both are built and verified during the deploy workflows
