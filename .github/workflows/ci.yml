name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run linter and formatter
        run: bun run check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Type check packages that don't depend on cloudflare:workers
      - name: Type check schemas
        run: bun run check-types
        working-directory: packages/schemas

      # Note: CMS typecheck skipped - importMap is auto-generated by Payload
      # Type errors are caught during build step instead

  # Note: CMS is deployed on Vercel separately (not part of Cloudflare deployment)
  # Note: Web and Server type checks require Cloudflare environment
  # - They import from cloudflare:workers module
  # - Type checking happens during Alchemy deploy (which sets up the environment)
